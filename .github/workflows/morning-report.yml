name: Morning Report

on:
  # 08:45 Asia/Seoul on weekdays. Windows Task Scheduler starts collection independently.
  schedule:
    - cron: "45 23 * * 0-4"
    # Reconcile or publish the delayed notice if the primary run deferred.
    - cron: "5 0 * * 1-5"
  push:
    branches: [main]
    paths: [content/publication/morning.json]
  workflow_dispatch:
    inputs:
      date:
        description: "Report date in YYYY-MM-DD. Defaults to current Asia/Seoul date."
        type: string
      rebuild_only:
        description: "Resume the latest pending Pages release without collecting."
        default: false
        type: boolean
      model_probe:
        description: "One private model generation check without publishing."
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-daily-report
  cancel-in-progress: false

jobs:
  build:
    if: ${{ (github.ref == 'refs/heads/main' || inputs.model_probe) && github.event_name != 'push' && !inputs.rebuild_only }}
    permissions:
      contents: write
    runs-on: ${{ fromJSON(vars.REPORT_RUNS_ON || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      REPORT_LLM_PROVIDER: ${{ vars.REPORT_LLM_PROVIDER || 'codex' }}
      CODEX_REPORT_MODEL: ${{ vars.CODEX_REPORT_MODEL }}
      CODEX_BINARY: ${{ vars.CODEX_BINARY }}
      CODEX_HOME: ${{ vars.CODEX_HOME }}
      CODEX_WORKSPACE_DIR: ${{ vars.CODEX_WORKSPACE_DIR }}
      CODEX_REASONING_EFFORT: ${{ vars.CODEX_REASONING_EFFORT || 'medium' }}
      CODEX_SUMMARY: ${{ vars.CODEX_SUMMARY || 'none' }}
      CODEX_PERSONALITY: ${{ vars.CODEX_PERSONALITY || 'none' }}
      CODEX_REQUEST_TIMEOUT: ${{ vars.CODEX_REQUEST_TIMEOUT || '180' }}
      OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
      NEWS_RSS_URLS: ${{ secrets.NEWS_RSS_URLS }}
      QUOTE_PROVIDER_URL: ${{ secrets.QUOTE_PROVIDER_URL }}
      QUOTE_PROVIDER_API_KEY: ${{ secrets.QUOTE_PROVIDER_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Resolve default Codex home
        if: env.REPORT_LLM_PROVIDER == 'codex' && env.CODEX_HOME == ''
        run: |
          $resolvedHome = Join-Path ([Environment]::GetFolderPath('UserProfile')) '.codex'
          if ($env:CODEX_BINARY -like '*\.codex\.sandbox-bin\codex.exe') {
            $resolvedHome = Split-Path (Split-Path $env:CODEX_BINARY -Parent) -Parent
          }
          if (Test-Path -LiteralPath $resolvedHome -PathType Container) {
            Add-Content -Path $env:GITHUB_ENV -Value "CODEX_HOME=$resolvedHome"
          }
      - name: Verify private Codex generation
        if: ${{ inputs.model_probe }}
        timeout-minutes: 5
        run: python scripts/verify_codex_runtime.py
      - name: Collect, verify and select
        if: ${{ !inputs.model_probe }}
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          $collectArgs = @('--trigger', 'github')
          if ($env:REQUESTED_DATE) { $collectArgs += @('--date', $env:REQUESTED_DATE) }
          python -m daytrade_agent.operations.morning @collectArgs

  package:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && !inputs.model_probe && needs.build.result != 'failure' }}
    needs: build
    permissions:
      contents: write
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      page_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Reconcile Pages and select the latest committed report
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m daytrade_agent.operations.pages plan
      - uses: actions/checkout@v4
        if: steps.plan.outputs.source_sha != ''
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: publication-source
          persist-credentials: false
      - name: Build site at packaging time
        if: steps.plan.outputs.source_sha != ''
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          python -m daytrade_agent.operations.pages package --source publication-source \
            --output dist --sha "$SOURCE_SHA"
      - uses: actions/configure-pages@v5
        id: pages
        if: steps.plan.outputs.source_sha != ''
      - uses: actions/upload-pages-artifact@v3
        id: artifact
        if: steps.plan.outputs.source_sha != ''
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
          retention-days: 7

  deploy:
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.package.outputs.artifact_id != '' }}
    needs: package
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ needs.package.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Publish the selected Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
        run: |
          python -m daytrade_agent.operations.pages deploy --sha "$SOURCE_SHA" \
            --artifact-id "$ARTIFACT_ID"
